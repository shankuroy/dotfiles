#cloud-config

# Ubuntu server cloud-init with Docker, some very basic ssh hardening,
# and unattended security upgrades that don't require a reboot.
#
# Intended for use with a cloud VPS firewall.
#
# multipass launch lts --cloud-init cloud-init-ubuntu-docker.yml --cpus 4 --memory 8G --disk 20G -vvvv --name ubuntu-docker
# multipass shell ubuntu-docker
# multipass delete ubuntu-docker && multipass purge

ssh_import_id: [ 'gh:shankuroy' ]

apt:
  sources:
    docker:
      source: deb https://download.docker.com/linux/ubuntu $RELEASE stable
      keyserver: https://download.docker.com/linux/ubuntu/gpg
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

package_update: true
package_upgrade: true

packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no

  - path: /etc/docker/daemon.json
    content: |
      {
        "no-new-privileges": true,
        "userland-proxy": false,
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

  - path: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

power_state:
  mode: reboot
  delay: now

