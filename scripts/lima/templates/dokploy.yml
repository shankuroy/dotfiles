minimumLimaVersion: 2.1.1

base:
- template:_images/ubuntu-lts

cpus: 4
memory: "8GiB"
disk: "20GiB"

containerd:
  system: false
  user: false

user:
  name: dokploy

provision:
- mode: system
  script: |
    #!/usr/bin/env bash

    export DEBIAN_FRONTEND=noninteractive

    apt update
    apt upgrade -y
    apt install -y neovim tmux

    if ! command -v docker >/dev/null 2>&1; then
      curl -sSL https://dokploy.com/install.sh | sh
      usermod -aG docker {{.User}}
    fi
- mode: user
  script: |
    #!/usr/bin/env bash

    cat <<EOF > ~/.bashrc-{{.User}}
    # GENERATED FILE - DO NOT EDIT - EDIT INSTEAD: ~/.bashrc-custom
    export TERM=xterm-256color
    export EDITOR=vim
    command -v nvim >/dev/null 2>&1 && alias vim=nvim
    touch ~/.bashrc-custom && source ~/.bashrc-custom
    EOF

    INCLUDE_USER='[[ -f ~/.bashrc-{{.User}} ]] && source ~/.bashrc-{{.User}}'
    grep -sqF "${INCLUDE_USER}" ~/.bashrc || echo "${INCLUDE_USER}" >> ~/.bashrc

