minimumLimaVersion: 2.1.1

base:
- template:_images/ubuntu-lts

cpus: 4
memory: "8GiB"
disk: "20GiB"

containerd:
  system: false
  user: false

user:
  name: dev

provision:
- mode: system
  script: |
    #!/usr/bin/env bash

    export DEBIAN_FRONTEND=noninteractive

    if ! command -v docker >/dev/null 2>&1; then
      curl -fsSL https://get.docker.com | sh
      usermod -aG docker dev
    fi

    apt update
    apt upgrade -y
    apt install -y neovim tmux
- mode: user
  script: |
    #!/usr/bin/env bash

    append() {
      TARGET=$1
      LINE=$2

      grep -sqF "${LINE}" "${TARGET}" || echo "${LINE}" >> "${TARGET}"
    }

    append ~/.bashrc 'source ~/.bashrc-dev'
    append ~/.bashrc-dev 'export TERM=xterm-256color'
    append ~/.bashrc-dev 'alias vim=nvim'

