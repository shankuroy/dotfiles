minimumLimaVersion: 2.1.1

base:
- template:_images/ubuntu-lts

cpus: 4
memory: "8GiB"
disk: "20GiB"

containerd:
  system: false
  user: false

user:
  name: administrator

provision:
- mode: system
  script: |
    #!/usr/bin/env bash

    export DEBIAN_FRONTEND=noninteractive

    if ! command -v docker >/dev/null 2>&1; then
      curl -fsSL https://get.docker.com | sh
      usermod -aG docker administrator
    fi

    apt update
    apt upgrade -y
    apt install -y neovim tmux
- mode: user
  script: |
    #!/usr/bin/env bash

    cat <<EOF > ~/.bashrc-administrator
    # GENERATED FILE - DO NOT EDIT - EDIT INSTEAD: ~/.bashrc-custom
    export TERM=xterm-256color
    command -v nvim >/dev/null 2>&1 && alias vim=nvim
    touch ~/.bashrc-custom && source ~/.bashrc-custom
    EOF

    INCLUDE_ADMIN='[[ -f ~/.bashrc-administrator ]] && source ~/.bashrc-administrator'
    grep -sqF "${INCLUDE_ADMIN}" ~/.bashrc || echo "${INCLUDE_ADMIN}" >> ~/.bashrc

